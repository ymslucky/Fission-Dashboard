<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fission Console</title>
<link rel="stylesheet" href="/styles.css">
</head>
<body>
<div class="shell">
  <header class="sidebar">
    <div class="brand"><span class="mark"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M13 2 4.5 13.5H11L9.5 22 19 9.5h-6.5L13 2Z"/></svg></span><span><b>FISSION CONSOLE</b><small>homelab</small></span></div>
    <nav id="nav" aria-label="主导航">
      <a href="#/overview" data-view="overview">总览</a>
      <a href="#/functions" data-view="functions">Functions</a>
      <a href="#/packages" data-view="packages">Packages</a>
      <a href="#/environments" data-view="environments">Environments</a>
      <a href="#/httptriggers" data-view="httptriggers">HTTP Triggers</a>
      <a href="#/timetriggers" data-view="timetriggers">Timer Triggers</a>
      <a href="#/tester" data-view="tester">API 测试台</a>
      <a href="#/gitops" data-view="gitops">GitOps</a>
    </nav>
    <div class="head-right">
      <span class="crumb" hidden>fission / <b id="crumb">总览</b></span>
      <button class="cmd-btn" id="cmdk-open">命令 <kbd>Ctrl K</kbd></button>
      <span class="pill" id="top-cluster"><span class="dot"></span>连接中</span>
      <span class="pill info" id="top-source"><span class="dot"></span>仓库未配置</span>
    </div>
  </header>
  <div class="workspace">
    <main id="main" class="main" tabindex="-1"></main>
  </div>
</div>
<dialog id="cmdk" class="cmdk">
  <input id="cmdk-input" placeholder="搜索页面、资源或操作…" autocomplete="off">
  <div class="list" id="cmdk-list"></div>
</dialog>
<div id="toasts" class="toasts" aria-live="polite"></div>
<dialog id="modal" class="modal"><div id="modal-body"></div></dialog>
<script src="/app.js"></script>
</body>
</html>
